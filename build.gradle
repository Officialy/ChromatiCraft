ext {
    mod_id          = "chromaticraft"
    mod_name        = "ChromatiCraft"
    mod_group_id    = "reika.chromaticraft"
    mod_description = "ChromatiCraft is a large magic mod based on the manipulation of colour, light and crystal energy, powered by DragonAPI."
}

// Headless in-world game tests: `gradlew :ChromatiCraft:runGameTest` launches a GameTestServer that
// runs every test in the chromaticraft namespace (progression core) and exits non-zero on failure.
neoForge {
    unitTest {
        enable()
        testedMod = mods.named(project.mod_id).get()
    }
    runs {
        client {
            if (project.hasProperty('chromaClientDirectory'))
                gameDirectory = file(project.property('chromaClientDirectory').toString())
        }
        clientData {
            gameDirectory = file('run-client-data')
        }
        serverData {
            // Datagen must not load optional client mods from the normal run/mods directory.
            gameDirectory = file('run-data')
        }
        gameTest {
            type = "gameTestServer"
            // Never share logs, configs, playerdata, or the generated test level with a live client.
            gameDirectory = file(project.findProperty('chromaTestDirectory') ?: 'run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Optional registry/palette export for biomepng analysis in a headless test.
            if (project.hasProperty('biomeLegendOutput')) {
                systemProperty 'dragonapi.biomeLegendOutput', rootProject.file(project.property('biomeLegendOutput')).absolutePath
                systemProperty 'dragonapi.biomeLegendGrass', rootProject.file(project.property('biomeLegendGrass')).absolutePath
            }
            // The namespace property controls registration, not selection. Without --tests,
            // vanilla runs every registered test from every loaded dependency.
            def selector = project.hasProperty('gameTestSelector')
                    ? project.property('gameTestSelector').toString()
                    : "${project.mod_id}:*"
            programArguments.addAll '--tests', selector
        }
    }
}

dependencies {
    // Optional real-mod integration verification, outside the play client's mods directory.
    if (project.hasProperty('populationChunkyJar'))
        runtimeOnly files(rootProject.file(project.property('populationChunkyJar')))
    compileOnly project(":VoidMonster")
    if (project.hasProperty('chromaWithVoidMonster')) runtimeOnly project(":VoidMonster")
    implementation project(":DragonAPI")
    implementation project(":RotaryCraft")
    implementation project(":GeoStrata")
    implementation project(":ReactorCraft")
    implementation project(":ElectriCraft")
    implementation project(":VoidMonster")
    implementation "com.github.glitchfiend:TerraBlender-neoforge:26.3-26.3.0.0.7-local.1"
}

